<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample table</title>
</head>
<body>

    <p>sample table in html</p>
    <!---tables in html-->
    <table border="">
        <tr>
            <td>name</td>
            <td>role</td>
        </tr>

        <tr>
            <td>steve</td>
            <td>front end</td>
        </tr>

        <tr>
            <td>iman</td>
            <td>business</td>        
        </tr>

    </table>

    <p>table 01 for item quantity and price</p>

    <table border="">
        <tr>
            <th>item</th>
            <th>quantity </th>
            <th>price</th>
        </tr>
        <tr>
            <td>glass</td>
            <td>12</td>
            <td>72</td>
        </tr>
        <tr>
            <td>bowl</td>
            <td>6</td>
            <td>36</td>
        </tr>
        <tr>
            <td>plate</td>
            <td>12</td>
            <td>144</td>
        </tr>
    </table>

    <p>table 02 with thead tbody and tfoot</p>

    <table border="">
        <thead>
            <tr>
                <th>item</th>
                <th>quantity </th>
                <th>price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
            <td>glass</td>
            <td>12</td>
            <td>72</td>
        </tr>
        <tr>
            <td>bowl</td>
            <td>6</td>
            <td>36</td>
        </tr>
        <tr>
            <td>plate</td>
            <td>12</td>
            <td>144</td>
        </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>total</td>
                <td>30</td>
                <td>252</td>
            </tr>
        </tfoot>



    </table>

</body>
</html>
